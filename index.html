<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit AI | Premium</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23030712' /><circle cx='16' cy='16' r='8' stroke='%236366f1' stroke-width='2' stroke-dasharray='32 10' /><circle cx='16' cy='16' r='3' fill='%23818cf8' /></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Animated Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-wrapper">
    
    <!-- Slide-out Sidebar for Chat History -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>History</h2>
            <button id="closeSidebar" class="icon-btn">✕</button>
        </div>
        <button id="newChatBtn" class="new-chat-btn">+ New Conversation</button>
        <div class="history-list" id="historyList">
            <!-- Dynamic chats load here -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- Sleek Top Navigation -->
        <header class="glass-header">
          <!-- 1. Hamburger Menu (Pushed to Far Left) -->
          <button id="menuBtn" class="icon-btn menu-btn" title="Menu">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <!-- 2. Orbit Brand (Pushed to Far Right) -->
          <div class="brand">
            <div class="logo-ring"></div>
            <span>Orbit</span>
          </div>
        </header>

        <!-- Main Chat Window -->
        <main class="chat-viewport">
          <div id="conversation" class="feed"></div>
        </main>

        <!-- Floating Composer -->
        <footer class="composer-container">
          <form id="chatForm" class="glass-composer">
            <textarea id="messageInput" rows="1" placeholder="Type your destination..." autofocus></textarea>
            <button type="submit" id="sendBtn" class="send-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
